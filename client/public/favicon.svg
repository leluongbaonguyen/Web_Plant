<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Rectangle -->
  <rect x="16" y="16" width="480" height="480" rx="128" fill="url(#bgGrad)" />

  <!-- Inner Dark Panel -->
  <rect x="36" y="36" width="440" height="440" rx="108" fill="url(#innerGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="4" />

  <!-- Calendar Base Grid Graphic -->
  <rect x="112" y="140" width="288" height="256" rx="36" fill="rgba(30, 41, 59, 0.8)" stroke="url(#sparkleGrad)" stroke-width="8" />

  <!-- Top Rings -->
  <rect x="160" y="104" width="24" height="64" rx="12" fill="#818cf8" />
  <rect x="328" y="104" width="24" height="64" rx="12" fill="#818cf8" />

  <!-- Calendar Header Line -->
  <line x1="112" y1="210" x2="400" y2="210" stroke="rgba(129, 140, 248, 0.4)" stroke-width="6" />

  <!-- Sparkle Star Center -->
  <path d="M256 240 L266 270 L296 280 L266 290 L256 320 L246 290 L216 280 L246 270 Z" fill="url(#bgGrad)" filter="url(#glow)" />
  <circle cx="330" cy="270" r="14" fill="#10b981" />
  <circle cx="180" cy="330" r="14" fill="#38bdf8" />
</svg>
